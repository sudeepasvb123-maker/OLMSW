<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>About Tutor - O/L Mathematics by Sudeepa Wishva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0f172a',
                            primary: '#3b82f6',
                            secondary: '#8b5cf6',
                            accent: '#f43f5e'
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* Floating Icons */
        .math-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>

<body
    class="bg-brand-dark text-white font-sans antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    </div>

    <script>
        const symbols = ['+', '-', '×', '÷', '∑', '∫', 'π', '√', '%', '∞', '≈', '≠', 'θ', 'Δ'];
        const container = document.querySelector('.math-bg');

        for (let i = 0; i < 50; i++) {
            const span = document.createElement('span');
            span.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            span.className = 'absolute text-brand-primary/20 font-bold select-none blur-[1px]';
            span.style.fontSize = `${Math.random() * 5 + 2}rem`;
            span.style.opacity = Math.random() * 0.4 + 0.1;
            span.style.left = `${Math.random() * 100}%`;
            span.style.top = `${Math.random() * 100}%`;
            const duration = Math.random() * 15 + 10;
            const delay = Math.random() * 5;
            span.style.animation = `float ${duration}s ease-in-out ${delay}s infinite alternate`;
            container.appendChild(span);
        }
    </script>

</html>
